<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo-row">
      <img
        src="/assets/images/valoores-logo.png"
        alt="Valoores Logo"
        class="valoores-logo-img"
      />

      <button type="button" class="menu-toggle" aria-label="Toggle menu">
        ☰
      </button>
    </div>

    <!-- Sidebar Search -->
    <div class="sidebar-search-wrapper">
      <div class="sidebar-search">
        <span class="search-icon">⌕</span>

        <input
          type="text"
          placeholder="Search menus..."
          autocomplete="off"
          [(ngModel)]="sidebarSearchText"
        />

        <button
          *ngIf="sidebarSearchText"
          type="button"
          class="clear-search-btn"
          aria-label="Clear search"
          (click)="clearSidebarSearch()"
        >
          ×
        </button>
      </div>

      <div class="sidebar-search-results" *ngIf="filteredSidebarItems.length > 0">
        <button
          type="button"
          class="sidebar-search-result"
          *ngFor="let item of filteredSidebarItems"
          (click)="selectSidebarItem(item)"
        >
          <span
            class="result-icon"
            [class.result-dot]="item.icon === '●'"
          >
            {{ item.icon }}
          </span>

          <span class="result-content">
            <span class="result-title">{{ item.label }}</span>
            <span class="result-group">{{ item.group }}</span>
          </span>
        </button>
      </div>

      <div
        class="sidebar-search-empty"
        *ngIf="sidebarSearchText && filteredSidebarItems.length === 0"
      >
        No menu found
      </div>
    </div>

    <nav class="menu">
      <a href="https://vfds.dev.hq.com/kyc" class="back-link">
        <span class="back-icon">↩</span>
        <span>Back</span>
      </a>

      <a routerLink="/digital-kyc/dashboard" routerLinkActive="active">
        <span class="nav-dot"></span>
        <span>Dashboard</span>
      </a>

      <a routerLink="/digital-kyc/wallet-create" routerLinkActive="active">
        <span class="nav-dot"></span>
        <span>Wallet Create</span>
      </a>

      <a routerLink="/digital-kyc/wallet-login" routerLinkActive="active">
        <span class="nav-dot"></span>
        <span>Wallet Login</span>
      </a>

      <a routerLink="/digital-kyc/wallet-query" routerLinkActive="active">
        <span class="nav-dot"></span>
        <span>Wallet Query</span>
      </a>

      <a routerLink="/digital-kyc/fabric-test" routerLinkActive="active">
        <span class="nav-dot"></span>
        <span>Fabric Test</span>
      </a>

      <div class="menu-divider"></div>

      <a routerLink="/digital-kyc/wallet-transfer" routerLinkActive="active">
        <span class="nav-dot"></span>
        <span>Wallet Transfer</span>
      </a>

      <a routerLink="/digital-kyc/organization-transfer" routerLinkActive="active">
        <span class="nav-dot"></span>
        <span>Organization Transfer</span>
      </a>

      <a routerLink="/digital-kyc/transaction-history" routerLinkActive="active">
        <span class="nav-dot"></span>
        <span>Transaction History</span>
      </a>

      <a
        routerLink="/data-generation-engine"
        routerLinkActive="active"
        class="sidebar-link"
      >
        <span class="nav-dot"></span>
        <span>Data Generation Engine</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      VFDS-BLOCKCHAIN/1.0.3
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <div class="breadcrumb">
        <span>TCR (The Crypto Road)</span>
        <span class="breadcrumb-separator">›</span>
        <span>Digital KYC</span>
      </div>
    </header>

    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
