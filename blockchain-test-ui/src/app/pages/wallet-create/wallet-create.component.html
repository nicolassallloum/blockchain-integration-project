<div class="page-container">
  <div class="page-header">
    <div>
      <h2>Create Wallet</h2>
      <p>Create a new customer wallet through the Blockchain API Middleware.</p>
    </div>

    <div class="actions">
      <button type="button" class="secondary-btn" (click)="fillSampleData()">
        Fill Sample
      </button>
      <button type="button" class="reset-btn" (click)="resetForm()">
        Reset
      </button>
    </div>
  </div>

  <div class="card">
    <form (ngSubmit)="createWallet()">
      <div class="grid">
        <div class="field">
          <label>Customer ID</label>
          <input
            type="text"
            name="customerId"
            [(ngModel)]="form.customerId"
            placeholder="CUST3001"
            required
          />
        </div>

        <div class="field">
          <label>Organization ID</label>
          <input
            type="text"
            name="organizationId"
            [(ngModel)]="form.organizationId"
            placeholder="26af0fd4-80c4-4da6-9240-b66ff88a7023"
            required
          />
        </div>

        <div class="field">
          <label>Full Name</label>
          <input
            type="text"
            name="fullName"
            [(ngModel)]="form.fullName"
            placeholder="Nicolas Salloum"
            required
          />
        </div>

        <div class="field">
          <label>Initial Balance</label>
          <input
            type="number"
            name="initialBalance"
            [(ngModel)]="form.initialBalance"
            placeholder="1000"
            required
          />
        </div>

        <div class="field">
          <label>National ID Hash</label>
          <input
            type="text"
            name="nationalIdHash"
            [(ngModel)]="form.nationalIdHash"
            placeholder="NID_HASH_3001"
            required
          />
        </div>

        <div class="field">
          <label>Mobile Hash</label>
          <input
            type="text"
            name="mobileHash"
            [(ngModel)]="form.mobileHash"
            placeholder="MOBILE_HASH_3001"
            required
          />
        </div>

        <div class="field">
          <label>Email Hash</label>
          <input
            type="text"
            name="emailHash"
            [(ngModel)]="form.emailHash"
            placeholder="EMAIL_HASH_3001"
            required
          />
        </div>

        <div class="field">
          <label>Password Hash</label>
          <input
            type="text"
            name="passwordHash"
            [(ngModel)]="form.passwordHash"
            placeholder="PASSWORD_HASH_3001"
            required
          />
        </div>
      </div>

      <div class="submit-row">
        <button type="submit" class="primary-btn" [disabled]="loading">
          {{ loading ? 'Creating Wallet...' : 'Create Wallet' }}
        </button>
      </div>
    </form>
  </div>

  <div *ngIf="successMessage" class="alert success">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="alert error">
    {{ errorMessage }}
  </div>

  <div *ngIf="responseData" class="response-card">
    <h3>API Response</h3>
    <pre>{{ responseData | json }}</pre>
  </div>
</div>
