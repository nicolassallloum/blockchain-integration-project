<div class="page-container">
  <div class="page-header">
    <div>
      <h2>Wallet Login</h2>
      <p>Authenticate using wallet address and password.</p>
    </div>

    <div class="actions">
      <button type="button" class="secondary-btn" (click)="fillSampleData()">
        Fill Sample
      </button>

      <button type="button" class="reset-btn" (click)="resetForm()">
        Reset
      </button>
    </div>
  </div>

  <div class="card">
    <form (ngSubmit)="loginWallet()">
      <div class="grid">
        <div class="field">
          <label>Wallet Address</label>
          <input
            type="text"
            name="walletAddress"
            [(ngModel)]="form.walletAddress"
            placeholder="Enter wallet address"
            required
          />
        </div>

        <div class="field">
          <label>Password</label>
          <input
            type="password"
            name="password"
            [(ngModel)]="form.password"
            placeholder="Enter wallet password"
            required
          />
        </div>
      </div>

      <div class="submit-row">
        <button type="submit" class="primary-btn" [disabled]="loading">
          {{ loading ? 'Logging in...' : 'Login Wallet' }}
        </button>
      </div>
    </form>
  </div>

  <div *ngIf="successMessage" class="alert success">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="alert error">
    {{ errorMessage }}
  </div>

  <div *ngIf="apiResponse" class="card response-card">
    <h3>Raw API Response</h3>

    <pre>{{ apiResponse | json }}</pre>
  </div>
</div>
