version: "3.8"

volumes:
  peer0_org1_data:
  peer0_org2_data:
  couchdb0_data:
  couchdb1_data:

networks:
  fabric_test:
    name: fabric_test

services:

  couchdb0:
    container_name: couchdb0
    image: couchdb:3.3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    networks:
      - fabric_test
    volumes:
      - couchdb0_data:/opt/couchdb/data

  couchdb1:
    container_name: couchdb1
    image: couchdb:3.3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "6984:5984"
    networks:
      - fabric_test
    volumes:
      - couchdb1_data:/opt/couchdb/data

  peer0.org1.blockchain.local:
    container_name: peer0.org1.blockchain.local
    image: hyperledger/fabric-peer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.org1.blockchain.local
      - CORE_PEER_ADDRESS=peer0.org1.blockchain.local:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_TLS_ENABLED=true

      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw

    ports:
      - "7051:7051"
    depends_on:
      - couchdb0
    networks:
      - fabric_test
    volumes:
      - peer0_org1_data:/var/hyperledger/production

  peer0.org2.blockchain.local:
    container_name: peer0.org2.blockchain.local
    image: hyperledger/fabric-peer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.org2.blockchain.local
      - CORE_PEER_ADDRESS=peer0.org2.blockchain.local:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_TLS_ENABLED=true

      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw

    ports:
      - "9051:9051"
    depends_on:
      - couchdb1
    networks:
      - fabric_test
    volumes:
      - peer0_org2_data:/var/hyperledger/production
